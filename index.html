<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/aistudio/Burgundy_and_Gold_Event_Rentals_Logo_b611a13d.png" />
    <title>Vvichelae Event Rentals | Every Celebration, Beautifully Set — Lagos, Nigeria</title>
    <meta
      name="description"
      content="Vvichelae Event Rentals supplies event chairs, banquet tables, canopies, decorative fabrics, stage platforms, lighting, and catering equipment across Lagos, Nigeria."
    />
    <meta property="og:title" content="Vvichelae Event Rentals — Lagos, Nigeria" />
    <meta
      property="og:description"
      content="Every Celebration, Beautifully Set. Browse event furniture, canopies, fabrics, accessories, and catering equipment rentals in Lagos."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#FFF9F0] text-[#245B59] antialiased selection:bg-[#E8C994]/50 selection:text-[#245B59]">
    <!-- Static hidden forms for Netlify Forms build-time detection -->
    <form
      name="vvichelae-rental-enquiries"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="vvichelae-rental-enquiries" />
      <input type="text" name="bot-field" />
      <input type="text" name="full-name" />
      <input type="tel" name="phone-number" />
      <input type="email" name="email-address" />
      <textarea name="rental-products"></textarea>
      <textarea name="product-quantities"></textarea>
      <input type="text" name="collection-date" />
      <input type="text" name="return-date" />
      <input type="text" name="rental-duration" />
      <input type="text" name="estimated-total" />
      <input type="text" name="fulfilment-preference" />
      <input type="text" name="event-location" />
      <textarea name="additional-instructions"></textarea>
    </form>

    <form
      name="vvichelae-contact-enquiries"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="vvichelae-contact-enquiries" />
      <input type="text" name="bot-field" />
      <input type="text" name="full-name" />
      <input type="tel" name="phone-number" />
      <input type="email" name="email-address" />
      <input type="text" name="event-type" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
